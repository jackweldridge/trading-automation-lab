# Private webapp (Module 7): cookie gate + static site + server-side token injection.
# Replace the placeholders (domain, cookie value, tokens, paths) with your own.
# Secrets live HERE on the server, never in the page the browser receives.

server {
    listen 443 ssl;
    server_name app.yourdomain.com;

    # TLS certificate from certbot / Let's Encrypt (Module 7.2):
    ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

    # The cookie gate: no valid pos_auth cookie -> refuse everything.
    # Set this cookie once in your browser (HttpOnly, Secure, SameSite).
    if ($http_cookie !~* "pos_auth=YOUR_LONG_RANDOM_COOKIE_VALUE") {
        return 403;
    }

    # The pre-rendered static site from build.py.
    root  /opt/webapp/site;
    index index.html;

    # Live price stream: the browser calls /live/, nginx adds the token server-side.
    location /live/ {
        proxy_pass http://127.0.0.1:9100/;        # the price streamer, localhost only
        proxy_set_header X-Token "YOUR_STREAMER_TOKEN";
        proxy_buffering off;                      # Server-Sent Events must be unbuffered
    }

    # Trade proposal: POST /propose -> the n8n approval webhook (token added here).
    location /propose {
        proxy_pass http://127.0.0.1:5678/webhook/propose;
        proxy_set_header X-Token "YOUR_WEBHOOK_TOKEN";
    }
}

# Force HTTPS: redirect any plain-HTTP visit to the secure site.
server {
    listen 80;
    server_name app.yourdomain.com;
    return 301 https://$host$request_uri;
}
